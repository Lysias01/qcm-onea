  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/style.css">

<body>
<main class="vue">
  <header class="entete-vue">
    <a class="btn-icone" href="index.html" aria-label="Retour à l'accueil">←</a>
    <div>
      <h1>Ma progression</h1>
      <p class="sous-titre-vue">Suivi de votre entraînement sur cet appareil.</p>
    </div>
    <button id="btn-theme-ui" class="btn-icone btn-theme-droite" aria-label="Changer le thème clair/sombre" title="Thème clair/sombre">◐</button>
  </header>

  <section class="stats-grille" id="stats"></section>

  <nav class="onglets" role="tablist" aria-label="Sections">
    <button role="tab" class="onglet actif" aria-selected="true" data-onglet="themes">Par thème</button>
    <button role="tab" class="onglet" aria-selected="false" data-onglet="historique">Historique</button>
    <button role="tab" class="onglet" aria-selected="false" data-onglet="records">Meilleurs scores</button>
  </nav>

  <section class="carte" data-panneau="themes" id="panneau-themes"></section>
  <section class="carte" data-panneau="historique" id="panneau-historique" hidden></section>
  <section class="carte" data-panneau="records" id="panneau-records" hidden></section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/config.js"></script>
<script src="js/donnees.js"></script>
<script src="js/storage.js"></script>
